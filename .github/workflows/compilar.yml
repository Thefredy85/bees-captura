name: Compilar Bee's Captura

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: bees-captura-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Enlace fijo para instalar desde la tableta:
      # https://github.com/Thefredy85/bees-captura/releases/latest/download/BeesCaptura.apk
      - name: Publicar APK para descargar
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BeesCaptura.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima BeesCaptura.apk --latest \
            --title "Bee's Captura (última versión)" \
            --notes "Compilación ${{ github.run_number }}. Abre este enlace en la tableta para instalar o actualizar."
